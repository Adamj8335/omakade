name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Omakade to do?
    validations:
      required: true
  - type: textarea
    id: launcher
    attributes:
      label: Launcher or platform details
      description: Include versions and native or Flatpak installation when relevant.
